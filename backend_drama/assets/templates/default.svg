<?xml version="1.0" encoding="UTF-8"?>
<!-- Default Drama frame template (vertical 720x1280).
     The content window (90,160 540x960) stays transparent so the episode
     video shows through. Everything else is channel branding. -->
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141428"/>
      <stop offset="1" stop-color="#1e1e3f"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
    <clipPath id="contentClip">
      <rect x="90" y="160" width="540" height="960" rx="18"/>
    </clipPath>
  </defs>

  <path d="M0,0 H720 V1280 H0 Z M90,160 h540 v960 h-540 Z"
        fill="url(#bg)" fill-rule="evenodd"/>
  <rect x="0" y="0" width="720" height="8" fill="url(#bar)"/>
  <rect x="0" y="1272" width="720" height="8" fill="url(#bar)"/>

  <circle cx="60" cy="80" r="26" fill="#4f46e5" opacity="0.9"/>
  <text x="60" y="89" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">D</text>
  <text x="100" y="72" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Drama Channel</text>
  <text x="100" y="100" font-family="sans-serif" font-size="16" fill="#a5b4fc">Phim hay mỗi ngày</text>

  <rect x="90" y="160" width="540" height="960" rx="18" fill="none" stroke="#4f46e5" stroke-width="4" opacity="0.9"/>
  <ellipse cx="660" cy="1200" rx="120" ry="60" fill="#4f46e5" opacity="0.15"/>

  <text x="360" y="1170" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#c7d2fe">Xem tiếp tập sau ►</text>
  <text x="360" y="1240" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#64748b">drama • vietsub</text>
</svg>
