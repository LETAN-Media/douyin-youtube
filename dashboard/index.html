<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>
<title>Douyin → YouTube</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    Inter,
    Arial,
    sans-serif;
  background: #0b0c10;
  color: #f5f5f5;
}

.container {
  width: min(1100px, 94%);
  margin: 40px auto;
}

.card {
  background: #15171d;
  border: 1px solid #292c34;
  border-radius: 16px;
  padding: 22px;
  margin-bottom: 18px;
}

h1,
h2 {
  margin-top: 0;
}

.grid {
  display: grid;
  grid-template-columns:
    repeat(2, minmax(0, 1fr));
  gap: 12px;
}

@media(max-width:700px) {
  .grid {
    grid-template-columns: 1fr;
  }
}

input,
textarea,
select,
button {
  width: 100%;
  border-radius: 10px;
  border: 1px solid #343741;
  padding: 12px;
  font-size: 15px;
}

input,
textarea,
select {
  color: white;
  background: #0f1116;
}

textarea {
  min-height: 110px;
}

button {
  cursor: pointer;
  border: 0;
  background: white;
  color: black;
  font-weight: 700;
}

button.secondary {
  background: #292c34;
  color: white;
}

.actions {
  display: flex;
  gap: 10px;
  margin-top: 12px;
}

.status {
  padding: 8px 12px;
  border-radius: 999px;
  background: #292c34;
  display: inline-block;
  font-size: 13px;
}

table {
  width: 100%;
  border-collapse: collapse;
}

td,
th {
  padding: 12px 8px;
  text-align: left;
  border-bottom: 1px solid #292c34;
  vertical-align: top;
}

.small {
  color: #a5a8b1;
  font-size: 13px;
}

.error {
  color: #ff8c8c;
  white-space: pre-wrap;
  max-width: 300px;
  word-break: break-word;
}

a {
  color: #8ab4ff;
}

.scroll {
  overflow-x: auto;
}
</style>
</head>

<body>
<div class="container">

<div class="card">
  <h1>Douyin → YouTube</h1>
  <div id="youtubeStatus" class="status">
    Checking...
  </div>
</div>

<div class="card">
  <h2>Cấu hình API</h2>

  <div class="grid">
    <div>
      <div class="small">Backend URL</div>
      <input
        id="apiUrl"
        placeholder="https://xxx.onrender.com"
      >
    </div>

    <div>
      <div class="small">Admin Token</div>
      <input
        id="adminToken"
        type="password"
        placeholder="ADMIN_TOKEN"
      >
    </div>
  </div>

  <div class="actions">
    <button onclick="saveConfig()">
      Lưu cấu hình
    </button>

    <button
      class="secondary"
      onclick="connectYoutube()"
    >
      Kết nối YouTube
    </button>
  </div>
</div>

<div class="card">
  <h2>Tạo job</h2>

  <div class="small">Douyin URL</div>
  <input
    id="douyinUrl"
    placeholder="https://www.douyin.com/video/..."
  >

  <br><br>

  <div class="small">
    YouTube title — bỏ trống để dùng title nguồn
  </div>
  <input
    id="title"
    placeholder="Tiêu đề YouTube"
  >

  <br><br>

  <div class="small">
    Description
  </div>
  <textarea
    id="description"
    placeholder="Mô tả..."
  ></textarea>

  <br>

  <div class="small">
    Privacy
  </div>

  <select id="privacy">
    <option value="private">
      Private
    </option>

    <option value="unlisted">
      Unlisted
    </option>

    <option value="public">
      Public
    </option>
  </select>

  <br><br>

  <button onclick="createJob()">
    Tải Douyin → Đăng YouTube
  </button>

  <p
    id="createMessage"
    class="small"
  ></p>
</div>

<div class="card">
  <div class="actions">
    <h2 style="flex:1">
      Jobs
    </h2>

    <button
      class="secondary"
      style="width:auto"
      onclick="loadJobs()"
    >
      Refresh
    </button>
  </div>

  <div class="scroll">
    <table>
      <thead>
      <tr>
        <th>Status</th>
        <th>Video</th>
        <th>YouTube</th>
        <th>Error</th>
        <th></th>
      </tr>
      </thead>

      <tbody id="jobs"></tbody>
    </table>
  </div>
</div>

</div>

<script>
function value(id) {
  return document
    .getElementById(id)
    .value
    .trim();
}

function apiUrl() {
  return value("apiUrl")
    .replace(/\/+$/, "");
}

function token() {
  return value("adminToken");
}

function headers() {
  return {
    "Content-Type": "application/json",
    "X-Admin-Token": token()
  };
}

function saveConfig() {
  localStorage.setItem(
    "dy_api_url",
    apiUrl()
  );

  localStorage.setItem(
    "dy_admin_token",
    token()
  );

  checkYoutube();
  loadJobs();
}

function loadConfig() {
  document.getElementById(
    "apiUrl"
  ).value = localStorage.getItem(
    "dy_api_url"
  ) || "";

  document.getElementById(
    "adminToken"
  ).value = localStorage.getItem(
    "dy_admin_token"
  ) || "";
}

async function apiFetch(
  path,
  options = {}
) {
  if (!apiUrl()) {
    throw new Error(
      "Chưa nhập Backend URL"
    );
  }

  const response = await fetch(
    apiUrl() + path,
    {
      ...options,
      headers: {
        ...headers(),
        ...(options.headers || {})
      }
    }
  );

  const text = await response.text();

  let data;

  try {
    data = JSON.parse(text);
  } catch {
    data = {
      detail: text
    };
  }

  if (!response.ok) {
    throw new Error(
      data.detail
      || "HTTP " + response.status
    );
  }

  return data;
}

async function checkYoutube() {
  const element = document.getElementById(
    "youtubeStatus"
  );

  if (!apiUrl() || !token()) {
    element.textContent =
      "Chưa cấu hình API";

    return;
  }

  try {
    const result = await apiFetch(
      "/api/youtube/status"
    );

    element.textContent = (
      result.connected
        ? "YouTube: Connected"
        : "YouTube: Not connected"
    );
  } catch (error) {
    element.textContent =
      "API error: " + error.message;
  }
}

async function connectYoutube() {
  try {
    const result = await apiFetch(
      "/api/youtube/oauth-url",
      {
        method: "POST"
      }
    );

    window.open(
      result.url,
      "_blank"
    );
  } catch (error) {
    alert(error.message);
  }
}

async function createJob() {
  const message = (
    document.getElementById(
      "createMessage"
    )
  );

  const url = value(
    "douyinUrl"
  );

  if (!url) {
    message.textContent =
      "Thiếu Douyin URL";
    return;
  }

  message.textContent =
    "Đang tạo job...";

  const payload = {
    douyin_url: url,
    privacy_status: value(
      "privacy"
    )
  };

  const title = value(
    "title"
  );

  const description = value(
    "description"
  );

  if (title) {
    payload.title = title;
  }

  if (description) {
    payload.description = (
      description
    );
  }

  try {
    const result = await apiFetch(
      "/api/jobs",
      {
        method: "POST",
        body: JSON.stringify(
          payload
        )
      }
    );

    message.textContent =
      "Đã tạo job: "
      + result.id;

    document.getElementById(
      "douyinUrl"
    ).value = "";

    await loadJobs();
  } catch (error) {
    message.textContent =
      "Lỗi: " + error.message;
  }
}

function appendCell(
  row,
  text,
  className = ""
) {
  const cell =
    document.createElement("td");

  cell.textContent =
    text ?? "";

  if (className) {
    cell.className =
      className;
  }

  row.appendChild(cell);

  return cell;
}

async function retryJob(id) {
  try {
    await apiFetch(
      "/api/jobs/"
      + encodeURIComponent(id)
      + "/retry",
      {
        method: "POST"
      }
    );

    await loadJobs();
  } catch (error) {
    alert(error.message);
  }
}

async function loadJobs() {
  const tbody = document.getElementById(
    "jobs"
  );

  if (!apiUrl() || !token()) {
    return;
  }

  try {
    const jobs = await apiFetch(
      "/api/jobs"
    );

    tbody.replaceChildren();

    for (const job of jobs) {
      const row =
        document.createElement("tr");

      appendCell(
        row,
        job.status
        + " "
        + job.progress
        + "%"
      );

      const videoCell =
        appendCell(
          row,
          job.title
          || job.source_title
          || job.source_url
        );

      const sourceLink =
        document.createElement("a");

      sourceLink.href =
        job.source_url;

      sourceLink.target =
        "_blank";

      sourceLink.rel =
        "noopener noreferrer";

      sourceLink.textContent =
        "Douyin";

      videoCell.appendChild(
        document.createElement("br")
      );

      videoCell.appendChild(
        sourceLink
      );

      const youtubeCell =
        document.createElement("td");

      if (job.youtube_url) {
        const link =
          document.createElement("a");

        link.href =
          job.youtube_url;

        link.target =
          "_blank";

        link.rel =
          "noopener noreferrer";

        link.textContent =
          "Open YouTube";

        youtubeCell.appendChild(
          link
        );
      } else {
        youtubeCell.textContent =
          "-";
      }

      row.appendChild(
        youtubeCell
      );

      appendCell(
        row,
        job.error || "",
        "error"
      );

      const actionCell =
        document.createElement("td");

      if (job.status === "failed") {
        const retry =
          document.createElement(
            "button"
          );

        retry.textContent =
          "Retry";

        retry.className =
          "secondary";

        retry.onclick = () =>
          retryJob(job.id);

        actionCell.appendChild(
          retry
        );
      }

      row.appendChild(
        actionCell
      );

      tbody.appendChild(
        row
      );
    }
  } catch (error) {
    console.error(error);
  }
}

loadConfig();
checkYoutube();
loadJobs();

setInterval(
  loadJobs,
  5000
);

setInterval(
  checkYoutube,
  15000
);
</script>
</body>
</html>
